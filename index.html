<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>АстроКод Фигуры</title>
<link rel="stylesheet" href="css/styles.css">
</head>
<body>
<script src="js/vk-bridge.min.js"></script>
<div class="app">
  <div class="screen active" id="screen-select">
    <div class="header">
      <h1><span class="title-sparkle">&#10024;</span><span class="title-text"> АстроКод Фигуры</span></h1>
      <p>Узнай свой звёздный путь к стройности</p>
    </div>
    <div class="zodiac-grid" id="zodiac-grid"></div>
    <p class="footer-hint">Выбери свой знак зодиака</p>
  </div>
  <div class="screen" id="screen-result">
    <button class="back-btn" id="back-btn">&#8592; Выбрать другой знак</button>
    <div class="result-header">
      <span class="big-sym" id="result-sym"></span>
      <h2 id="result-name"></h2>
    </div>
    <div id="result-content"></div>
    <div class="actions">
      <button class="btn-primary" id="share-btn">&#128228; Поделиться в истории</button>
      <button class="btn-secondary" id="another-sign-btn">&#128260; Выбрать другой знак</button>
    </div>
  </div>
</div>
<script src="js/zodiac-data.js"></script>
<script src="js/zodiac-icons.js"></script>
<script src="js/zodiac-female-icons.js"></script>
<script src="js/zodiac-details.js"></script>
<script src="js/app.js"></script>
</body>
</html>
